# Serve the frontend on a separate computer. Replace hostname, root and Nano IP.
server {
    listen 80;
    server_name road-hazards.local;
    root /var/www/road-hazard;
    index index.html;
    client_max_body_size 256m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build with VITE_API_BASE_URL=http://road-hazards.local/api
    # For HTTPS, enable TLS here and use https://road-hazards.local/api instead.
    location /api/ {
        proxy_pass http://192.168.1.50:8000/;
        proxy_http_version 1.1;
        # Nginx buffers chunked client uploads and sends Content-Length upstream.
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_set_header Host $proxy_host;
    }
}
